name: the_daily_truth
description: "The DailyTruth — AI-powered fake news detection platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  pretty_dio_logger: ^1.4.0

  # Routing
  go_router: ^14.6.2

  # Models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  intl: ^0.19.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Utilities
  share_plus: ^10.1.2
  uuid: ^4.5.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
